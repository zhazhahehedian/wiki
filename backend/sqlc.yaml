version: "2"
sql:
  - engine: "postgresql"
    queries: "./internal/repo/queries"
    schema:  "./internal/repo/migrations"
    gen:
      go:
        package: "generated"
        out: "./internal/repo/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
        rename:
          knowledge_basis: KnowledgeBase
